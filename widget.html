<!--
  =============================================
  下関市 補助金チャット ウィジェット 埋め込みコード
  ※ このコードをホームページの </body> の直前に貼り付けてください
  =============================================
-->
<style>
  /* ── 起動ボタン ── */
  #subsidy-chat-btn {
    position: fixed;
    bottom: 24px;
    right: 24px;
    z-index: 9000;
    background: #1a56a0;
    color: #fff;
    border: none;
    border-radius: 50px;
    padding: 14px 20px;
    font-size: 0.92rem;
    font-family: 'Hiragino Sans', 'Meiryo', sans-serif;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(0,0,0,.3);
    display: flex;
    align-items: center;
    gap: 8px;
    transition: background .15s, transform .15s;
  }
  #subsidy-chat-btn:hover { background: #154480; transform: translateY(-2px); }
  #subsidy-chat-btn .chat-icon { font-size: 1.2rem; }

  /* ── ポップアップ枠 ── */
  #subsidy-chat-popup {
    position: fixed;
    bottom: 90px;
    right: 24px;
    z-index: 9001;
    width: 400px;
    height: 600px;
    max-width: calc(100vw - 32px);
    max-height: calc(100vh - 100px);
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 8px 40px rgba(0,0,0,.25);
    display: none;
    flex-direction: column;
    overflow: hidden;
  }
  #subsidy-chat-popup.open { display: flex; }

  /* ── ポップアップ ヘッダー ── */
  #subsidy-chat-popup-header {
    background: #1a56a0;
    color: #fff;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-family: 'Hiragino Sans', 'Meiryo', sans-serif;
    font-size: 0.9rem;
    font-weight: bold;
    flex-shrink: 0;
  }
  #subsidy-chat-popup-header span { display: flex; align-items: center; gap: 8px; }

  #subsidy-chat-close {
    background: none;
    border: none;
    color: #fff;
    font-size: 1.4rem;
    cursor: pointer;
    line-height: 1;
    padding: 0 4px;
    opacity: .85;
  }
  #subsidy-chat-close:hover { opacity: 1; }

  /* ── iframe ── */
  #subsidy-chat-frame {
    flex: 1;
    border: none;
    width: 100%;
  }
</style>

<!-- 起動ボタン -->
<button id="subsidy-chat-btn" aria-label="補助金案内チャットを開く">
  <span class="chat-icon">💬</span> 補助金・給付金を調べる
</button>

<!-- ポップアップ -->
<div id="subsidy-chat-popup" role="dialog" aria-label="補助金案内チャット">
  <div id="subsidy-chat-popup-header">
    <span>💬 補助金・給付金 案内チャット</span>
    <button id="subsidy-chat-close" aria-label="閉じる">×</button>
  </div>
  <iframe
    id="subsidy-chat-frame"
    src="https://tsubasaito226-droid.github.io/subsidy-chatbot/"
    title="下関市補助金案内チャット"
    loading="lazy"
  ></iframe>
</div>

<script>
  (function() {
    var btn   = document.getElementById('subsidy-chat-btn');
    var popup = document.getElementById('subsidy-chat-popup');
    var close = document.getElementById('subsidy-chat-close');

    btn.addEventListener('click', function() {
      popup.classList.toggle('open');
    });
    close.addEventListener('click', function() {
      popup.classList.remove('open');
    });
    // ポップアップ外クリックで閉じる
    document.addEventListener('click', function(e) {
      if (!popup.contains(e.target) && e.target !== btn && !btn.contains(e.target)) {
        popup.classList.remove('open');
      }
    });
  })();
</script>
